<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>ページが見つかりません｜ワンビー食堂</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #faf8ef;
        color: #241709;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
      }
      p {
        line-height: 1.9;
      }
      a {
        display: inline-block;
        padding: 1rem 2rem;
        background: #ffd42f;
        border-radius: 10px;
        color: inherit;
        font-weight: bold;
      }
      a:focus-visible {
        outline: 3px solid #241709;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>ワンビー食堂 / 404</p>
      <h1>ページが見つかりません</h1>
      <p>指定されたページは移動したか、存在しない可能性があります。</p>
      <a href="/sample_food1/">トップページへ戻る</a>
    </main>
  </body>
</html>
